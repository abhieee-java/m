plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.mydialer'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.mydialer"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                    'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Standard Android Libraries
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    
    // --- THE FIX: Material Design Library ---
    // This allows the app to use BottomNavigationView and FloatingActionButton attributes
    implementation 'com.google.android.material:material:1.12.0'
    
    // Kotlin Support (Kept for library compatibility)
    implementation 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'
    implementation 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
}
